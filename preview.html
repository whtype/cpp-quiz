<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>C++ 刷题</title>
<meta name="cpp-quiz-release" content="3.3.0-web">
<link rel="icon" href="data:,">
<style>
  :root{
    --paper:#F6F3EC; --paper2:#EFEAE0; --card:#fff;
    --ink:#1B1917; --ink2:#6E695F; --ink3:#767064; --ink4:#827b6e;
    --line:rgba(27,25,23,.08); --line2:rgba(27,25,23,.05);
    --accent:#D9542B; --accent2:#B8431F; --accsoft:rgba(217,84,43,.09);
    --ok:#2E7D5B; --oksoft:rgba(46,125,91,.09);
    --err:#C1463B; --errsoft:rgba(193,70,59,.09);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0}
  body{
    background:#E8E3D8;
    background-image:radial-gradient(circle at 20% 0%, #F2EEE4 0%, #E4DED1 60%, #DCD5C6 100%);
    font:14px/1.65 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
    color:var(--ink);
    min-height:100vh;display:flex;align-items:flex-start;justify-content:center;
    gap:64px;padding:44px 32px;flex-wrap:wrap;
  }
  .serif{font-family:Georgia,"Times New Roman","Songti SC",serif}

  /* ---------- 手机外框 ---------- */
  .phone{
    width:390px;height:844px;background:var(--paper);border-radius:46px;
    box-shadow:0 2px 4px rgba(60,50,30,.08), 0 40px 90px -30px rgba(60,50,30,.45), 0 0 0 9px #1d1b19, 0 0 0 10px #3a3733;
    overflow:hidden;position:relative;display:flex;flex-direction:column;flex-shrink:0;
  }
  .sbar{height:44px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;
    padding:0 26px;font-size:13px;font-weight:600;color:var(--ink);letter-spacing:.3px}
  .sbar .r{display:flex;gap:5px;align-items:center;font-size:11px;letter-spacing:0}

  .screen{flex:1;overflow-y:auto;overflow-x:hidden;padding:0 20px 20px;position:relative;background:var(--paper)}
  .screen::-webkit-scrollbar{width:0}

  /* ---------- 基础组件 ---------- */
  .nav{display:flex;align-items:center;height:44px;position:relative}
  .nav-title{flex:1;font-size:15px;font-weight:600;letter-spacing:.5px}
  .nav-act{display:flex;align-items:center;height:44px;margin-right:-4px;padding:0 0 0 12px;
    font-size:12.5px;color:var(--ink2);cursor:pointer}
  .nav-back{width:44px;height:44px;margin-left:-11px;display:flex;align-items:center;justify-content:center;
    font-size:21px;cursor:pointer}
  .nav-back:active{opacity:.5}

  .kicker{font-size:11px;letter-spacing:3px;color:var(--ink3);text-transform:uppercase}
  .kicker.acc{color:var(--accent)}
  .h1{font-size:38px;line-height:1.12;letter-spacing:-.5px;margin:8px 0 0}
  .h1.serif{font-weight:400}

  .sec{display:flex;align-items:baseline;justify-content:space-between;margin:28px 0 10px}
  .sec .t{font-size:13px;font-weight:600;letter-spacing:1.5px;color:var(--ink2)}
  .sec .s{font-size:11.5px;color:var(--ink3)}

  .list{background:#fff;border-radius:14px;overflow:hidden;
    box-shadow:0 1px 2px rgba(27,25,23,.03), 0 12px 30px -22px rgba(27,25,23,.35)}
  .row{display:flex;align-items:center;padding:15px 16px;position:relative;cursor:pointer}
  .row+.row:before{content:'';position:absolute;left:16px;right:16px;top:0;height:1px;background:var(--line2)}
  .row:active{background:rgba(27,25,23,.02)}
  .rt{flex:1;min-width:0}
  .rn{font-size:15px;font-weight:500}
  .rd{font-size:11.5px;color:var(--ink3);margin-top:2px}
  .rv{font-size:15px;color:var(--ink3);margin-left:8px;font-family:Georgia,serif}
  .rv b{color:var(--ink);font-weight:400}
  .rarw{font-size:15px;color:var(--ink4);margin-left:6px}

  .bar{height:2px;border-radius:2px;background:rgba(27,25,23,.06);overflow:hidden}
  .bar>i{display:block;height:100%;background:var(--ink4);border-radius:2px;transition:width .45s ease}

  .btn{display:flex;align-items:center;justify-content:center;height:48px;border-radius:999px;border:none;
    background:var(--accent);color:#fff;font-size:15.5px;font-weight:600;letter-spacing:1.5px;
    box-shadow:0 8px 20px -10px rgba(217,84,43,.65);cursor:pointer;width:100%;font-family:inherit}
  .btn:active{background:var(--accent2);transform:scale(.99)}
  .btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);box-shadow:none;font-weight:500}
  .btn.plain{background:var(--paper2);color:var(--ink);box-shadow:none;font-weight:500}
  .link{text-align:center;font-size:13px;color:var(--ink3);padding:14px 0 4px;cursor:pointer}

  .tag{display:inline-block;padding:2px 7px;border-radius:3px;font-size:10.5px;letter-spacing:.5px;
    color:var(--ink3);background:rgba(27,25,23,.045);margin-right:5px}
  .tag.err{color:var(--err);background:var(--errsoft)}

  .code{background:#F3EFE6;border-left:2px solid var(--ink4);border-radius:2px;padding:11px 12px;
    font:11.5px/1.75 "SFMono-Regular",Consolas,monospace;color:#3A3730;white-space:pre-wrap;
    word-break:break-word;margin-top:12px}

  .foot{text-align:center;padding:28px 0 12px;font-size:10px;letter-spacing:.5px;color:var(--ink4)}

  /* ---------- 首页 ---------- */
  .strip{display:flex;align-items:flex-end;padding:10px 0 6px}
  .strip .st{flex:1;text-align:center;cursor:pointer}
  .strip .st:first-child{text-align:left}
  .strip .st:last-child{text-align:right}
  .st-n{font-size:34px;line-height:1;letter-spacing:-.5px}
  .st-u{font-size:14px;color:var(--ink3);margin-left:1px}
  .st-l{margin-top:5px;font-size:11px;letter-spacing:1px;color:var(--ink3)}
  .stline{width:1px;height:28px;background:var(--line);margin-bottom:7px}

  .hero{position:relative;margin-top:14px;background:#fff;border-radius:16px;padding:20px 22px 16px 24px;
    overflow:hidden;cursor:pointer;
    box-shadow:0 2px 3px rgba(27,25,23,.03), 0 22px 40px -30px rgba(27,25,23,.4)}
  .hero:active{transform:scale(.994)}
  .spine{position:absolute;left:10px;top:0;bottom:0;width:2px;background:var(--accent);opacity:.9}
  .hero-t{font-size:31px;line-height:1.1;letter-spacing:1px;margin-top:7px}
  .hero-d{margin-top:6px;font-size:12px;color:var(--ink3)}
  .hero-cta{position:absolute;right:18px;top:42px;width:44px;height:44px;border-radius:50%;
    background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-size:17px;
    box-shadow:0 8px 18px -8px rgba(217,84,43,.7)}
  .hero-bar{margin-top:18px;height:2px;background:rgba(27,25,23,.07);border-radius:2px;overflow:hidden}
  .hero-bar>i{display:block;height:100%;background:var(--accent);border-radius:2px}
  .hero-foot{display:flex;justify-content:space-between;margin-top:7px;font-size:10.5px;color:var(--ink4);letter-spacing:.5px}

  .grid{display:flex;flex-wrap:wrap;margin:0 -3.5px}
  .tile{width:calc(50% - 7px);margin:0 3.5px 7px;background:#fff;border:1px solid var(--line);
    border-radius:13px;padding:15px 15px 14px;cursor:pointer}
  .tile:active{background:rgba(27,25,23,.02)}
  .tile-n{font-size:28px;line-height:1;letter-spacing:-.5px}
  .tile-l{margin-top:8px;font-size:13.5px;font-weight:500}
  .tile-d{margin-top:2px;font-size:10.5px;color:var(--ink3)}
  .tile-rs{margin-top:6px;padding-top:5px;border-top:1px dashed var(--line);
    font-size:10px;color:var(--accent);letter-spacing:.3px}

  .cat{display:flex;align-items:center;padding:15px 16px;position:relative;cursor:pointer}
  .cat+.cat:before{content:'';position:absolute;left:16px;right:16px;top:0;height:1px;background:var(--line2)}
  .cat:active{background:rgba(27,25,23,.02)}
  .cat-b{flex:1;min-width:0;padding-right:12px}
  .cat-n{font-size:14.5px;font-weight:500}
  .cat-d{margin:3px 0 15px;font-size:10.5px;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .cat-rs{margin:-10px 0 10px;font-size:10px;color:var(--accent)}
  .cat-v{font-size:13px;color:var(--ink4);letter-spacing:.3px}
  .cat-v .cur{color:var(--ink)}

  .rrow{display:flex;align-items:center;justify-content:space-between;padding:13px 16px;position:relative}
  .rrow+.rrow:before{content:'';position:absolute;left:16px;right:16px;top:0;height:1px;background:var(--line2)}
  .rr-n{font-size:13.5px}
  .rr-t{font-size:10.5px;color:var(--ink4);margin-left:7px}
  .rr-a{font-size:16px}

  /* ---------- 答题页 ---------- */
  .pline{height:2px;margin:0 -20px}
  .qmeta{display:flex;align-items:baseline;padding-top:13px;background:transparent}
  .qm-i{font-size:17px;letter-spacing:.3px}
  .qm-t{font-size:12px;color:var(--ink4)}
  .qm-dot{margin:0 7px;color:var(--ink4);font-size:11px}
  .qm-t2{font-size:11px;color:var(--ink3);margin-right:7px;letter-spacing:.5px}
  .qm-cat{font-size:10px;color:var(--ink3);letter-spacing:.5px;border:1px solid var(--line2);border-radius:2px;
    padding:1px 5px 2px;margin-right:6px;transform:translateY(-1px)}
  .qm-timer{margin-left:auto;font-size:12px;color:var(--ink3);font-variant-numeric:tabular-nums}
  .qm-timer.exam{color:var(--accent)}
  .qtext{margin-top:17px;font-size:20px;line-height:1.72;font-weight:500;letter-spacing:.2px;word-break:break-word}
  .opts{margin-top:22px}
  .opt{display:flex;align-items:flex-start;padding:15px 15px 15px 13px;margin-bottom:8px;background:#fff;
    border:1px solid var(--line);border-radius:11px;cursor:pointer;transition:background .16s,border-color .16s}
  .opt:active{background:rgba(27,25,23,.02)}
  .ok-l{width:23px;flex-shrink:0;font-size:14px;line-height:1.5;color:var(--ink3);font-family:Georgia,serif}
  .ot{flex:1;font-size:15px;line-height:1.6;word-break:break-word}
  .om{width:20px;flex-shrink:0;text-align:right;font-size:13px;line-height:1.6}
  .opt.picked{border-color:var(--accent);background:var(--accsoft)}
  .opt.picked .ok-l{color:var(--accent)}
  .opt.right{border-color:rgba(46,125,91,.4);background:var(--oksoft)}
  .opt.right .ok-l{color:var(--ok)}
  .opt.wrong{border-color:rgba(193,70,59,.38);background:var(--errsoft)}
  .opt.wrong .ok-l{color:var(--err)}
  .opt.dim{opacity:.4}
  .mtip{margin:5px 2px 11px;font-size:11px;color:var(--ink3)}

  .exp{margin-top:20px;background:#fff;border-radius:13px;padding:17px 16px;
    box-shadow:0 2px 3px rgba(27,25,23,.03), 0 18px 34px -28px rgba(27,25,23,.4);
    animation:fu .32s cubic-bezier(.22,1,.36,1) both}
  @keyframes fu{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  .exp-head{display:flex;align-items:baseline;justify-content:space-between}
  .exp-st{font-size:17px;font-weight:600;letter-spacing:.5px}
  .exp-ans{font-size:15px;color:var(--ink2);letter-spacing:1px}
  .exp-you{margin-top:4px;font-size:11.5px;color:var(--ink3)}
  .exp-line{height:1px;background:var(--line2);margin:13px 0 11px}
  .exp-t{font-size:13.5px;line-height:1.85;color:var(--ink2);word-break:break-word}

  .bb{position:sticky;bottom:0;left:0;right:0;display:flex;align-items:center;gap:8px;
    margin:0 -20px;padding:9px 20px 14px;background:linear-gradient(180deg,rgba(246,243,236,0) 0%,#F6F3EC 30%);z-index:9}
  .bb-ico{width:44px;height:44px;border-radius:50%;background:#fff;border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;font-size:15px;color:var(--ink2);flex-shrink:0;cursor:pointer}
  .bb-ico.off{opacity:.35}
  .bb-ico.on{color:var(--accent);border-color:rgba(217,84,43,.35)}
  .bb-main{flex:1;height:46px;border-radius:999px;background:var(--accent);color:#fff;
    display:flex;align-items:center;justify-content:center;font-size:15.5px;font-weight:600;letter-spacing:2px;
    box-shadow:0 8px 20px -10px rgba(217,84,43,.65);cursor:pointer}
  .bb-main:active{background:var(--accent2)}
  .pad-b{height:76px}

  /* ---------- 题库页 ---------- */
  .head{padding:12px 2px 0}
  .head-d{margin-top:9px;font-size:12px;line-height:1.7;color:var(--ink3);max-width:290px}
  .sum{display:flex;align-items:center;margin-top:18px;background:#fff;border-radius:14px;padding:17px 0;
    box-shadow:0 2px 3px rgba(27,25,23,.03), 0 18px 34px -28px rgba(27,25,23,.4)}
  .sum-i{flex:1;text-align:center}
  .sum-n{font-size:26px;line-height:1}
  .sum-n.acc{color:var(--accent)}
  .sum-l{margin-top:5px;font-size:10.5px;letter-spacing:1px;color:var(--ink3)}
  .sumline{width:1px;height:28px;background:var(--line)}
  .src{padding:14px 16px;position:relative}
  .src+.src:before{content:'';position:absolute;left:16px;right:16px;top:0;height:1px;background:var(--line2)}
  .src-top{display:flex;align-items:flex-start}
  .src-b{flex:1;min-width:0;padding-right:10px}
  .src-n{display:flex;align-items:center;font-size:14.5px;font-weight:500}
  .src-tag{margin-left:6px;padding:1px 5px;font-size:9.5px;letter-spacing:.5px;color:var(--ink3);
    background:rgba(27,25,23,.05);border-radius:2px}
  .src-d{margin-top:3px;font-size:10.5px;color:var(--ink3)}
  .src-foot{display:flex;align-items:center;justify-content:space-between;margin-top:7px}
  .src-st{font-size:10.5px;color:var(--ink4)}
  .src-op{font-size:10.5px;color:var(--accent);cursor:pointer;padding:2px 0 2px 8px}
  .tg{width:39px;height:22px;border-radius:999px;background:rgba(27,25,23,.13);position:relative;
    flex-shrink:0;margin-top:3px;transition:background .2s;cursor:pointer}
  .tg-k{position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;
    box-shadow:0 1px 3px rgba(27,25,23,.25);transition:left .2s}
  .tg.on{background:var(--accent)}
  .tg.on .tg-k{left:19px}
  .log{margin-top:12px;text-align:center;font-size:11.5px;letter-spacing:.5px;color:var(--ink3)}
  .log.ok{color:var(--ok)} .log.err{color:var(--err)}
  .note{margin-top:24px;padding:0 2px 20px;font-size:10.5px;line-height:1.8;color:var(--ink4)}

  /* ---------- 结果 ---------- */
  .rs{padding:20px 2px 0}
  .rs-n{display:flex;align-items:flex-end}
  .rs-n .serif{font-size:86px;line-height:.94;letter-spacing:-3px}
  .rs-u{font-size:15px;color:var(--ink3);margin:0 0 8px 6px}
  .rs-c{margin-top:9px;font-size:13.5px;color:var(--ink2)}
  .rs-row{display:flex;align-items:center;margin-top:22px;padding:15px 0;
    border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
  .rs-i{flex:1;text-align:center}
  .rs-i .serif{font-size:17px}
  .rs-l{display:block;margin-top:3px;font-size:10px;letter-spacing:1px;color:var(--ink3)}
  .rsline{width:1px;height:22px;background:var(--line)}

  .items{background:#fff;border-radius:14px;overflow:hidden;
    box-shadow:0 2px 3px rgba(27,25,23,.03), 0 18px 34px -28px rgba(27,25,23,.4)}
  .it{padding:14px 15px;position:relative;cursor:pointer}
  .it+.it:before{content:'';position:absolute;left:15px;right:15px;top:0;height:1px;background:var(--line2)}
  .it-head{display:flex;align-items:baseline}
  .it-no{width:26px;flex-shrink:0;font-size:14px;font-family:Georgia,serif}
  .it-q{flex:1;font-size:13.5px;line-height:1.6;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .it.open .it-q{-webkit-line-clamp:20}
  .it-mark{width:20px;flex-shrink:0;text-align:right;font-size:12px}
  .it-body{padding:5px 0 3px 26px;animation:fu .3s both}
  .it-l{display:flex;align-items:baseline;margin-top:7px}
  .it-l .k{width:70px;flex-shrink:0;font-size:11.5px;color:var(--ink3)}
  .it-l .v{font-size:13.5px;letter-spacing:.5px}
  .it-exp{margin-top:9px;font-size:12.5px;line-height:1.85;color:var(--ink2)}
  .it-rm{margin-top:13px;display:inline-block;padding:6px 13px;border:1px solid var(--line);
    border-radius:999px;font-size:11.5px;color:var(--ink2)}
  .btns{display:flex;gap:8px;margin-top:22px}
  .btns .btn{flex:1}
  .pb{height:20px}

  /* 导入 */
  .ta-card{margin-top:18px;background:#fff;border:1px dashed rgba(27,25,23,.16);border-radius:13px;padding:13px 14px 9px}
  .ta{width:100%;height:190px;border:none;outline:none;resize:none;font:13.5px/1.75 inherit;color:var(--ink);background:transparent}
  .ta::placeholder{color:var(--ink4);font-size:12.5px;line-height:1.8}
  .ta-foot{display:flex;justify-content:flex-end;padding-top:7px;border-top:1px solid var(--line2)}
  .ta-op{font-size:11.5px;color:var(--accent);padding:3px 0 3px 14px;cursor:pointer}
  .ta-op.dim{color:var(--ink3)}
  .pick{display:flex;align-items:center;justify-content:space-between;padding:14px 3px}
  .pick-k{font-size:13px;color:var(--ink2)}
  .pick-v{font-size:13.5px}
  .pick-arw{font-size:10px;color:var(--ink3)}
  .fmt{background:#fff;border-radius:13px;border:1px solid var(--line);overflow:hidden}
  .f{display:flex;align-items:baseline;padding:12px 14px;position:relative}
  .f+.f:before{content:'';position:absolute;left:14px;right:14px;top:0;height:1px;background:var(--line2)}
  .f-k{width:50px;flex-shrink:0;font-size:11.5px;color:var(--ink3);letter-spacing:.5px}
  .f-v{flex:1;font-size:12px;line-height:1.65;color:var(--ink2)}

  .empty{text-align:center;padding:90px 20px}
  .empty .e1{font-size:42px;color:var(--ink4);line-height:1;font-family:Georgia,serif}
  .empty .e2{margin-top:12px;font-size:13px;color:var(--ink3)}

  .tabs{display:flex;margin-top:8px;border-bottom:1px solid var(--line)}
  .tab{display:flex;align-items:baseline;padding:10px 0 11px;margin-right:26px;font-size:14.5px;
    color:var(--ink3);position:relative;cursor:pointer}
  .tab-n{margin-left:5px;font-size:12px;color:var(--ink4);font-family:Georgia,serif}
  .tab.on{color:var(--ink);font-weight:600}
  .tab.on .tab-n{color:var(--accent)}
  .tab.on:after{content:'';position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--ink);border-radius:2px}


  /* ---------- 书架 ---------- */
  .shelf{margin-top:4px}
  .bk{display:flex;background:#fff;border-radius:4px 12px 12px 4px;margin-bottom:9px;overflow:hidden;
    box-shadow:0 1px 2px rgba(27,25,23,.04), 0 16px 30px -26px rgba(27,25,23,.5);
    cursor:pointer;transition:transform .14s,box-shadow .14s}
  .bk:hover{box-shadow:0 1px 2px rgba(27,25,23,.05), 0 18px 34px -24px rgba(27,25,23,.55)}
  .bk:active{transform:scale(.985)}
  .bk-spine{width:4px;flex-shrink:0;background:var(--ink4);opacity:.55}
  .bk.free .bk-spine{background:var(--accent);opacity:.9}
  .bk-body{flex:1;min-width:0;padding:15px 15px 13px 14px}
  .bk-t{font-family:Georgia,"Songti SC",serif;font-size:18px;line-height:1.3;letter-spacing:.2px}
  .bk-en{margin-top:3px;font-size:10px;line-height:1.5;color:var(--ink4);font-style:italic}
  .bk-meta{margin-top:6px;font-size:10px;color:var(--ink3)}
  .bk-meta .dot{margin:0 4px}
  .bk-desc{margin-top:8px;font-size:12.5px;line-height:1.75;color:var(--ink2)}
  .bk-why{margin-top:9px;padding:9px 10px;background:var(--paper);border-radius:5px}
  .why-k{display:block;font-size:9px;letter-spacing:1.5px;color:var(--ink4)}
  .why-v{display:block;margin-top:3px;font-size:11.5px;line-height:1.7;color:var(--ink2)}
  .bk-foot{display:flex;align-items:center;justify-content:space-between;margin-top:11px;
    padding-top:9px;border-top:1px solid var(--line2)}
  .lic{flex:1;font-size:9.5px;line-height:1.5;color:var(--ink4);padding-right:8px}

  .pk-c.on .n{color:var(--accent)}
  .pk-go{margin-top:14px;height:46px;border-radius:999px;background:var(--accent);color:#fff;
    display:flex;align-items:center;justify-content:center;font-size:14.5px;letter-spacing:1px}
  .pk-go:active{background:var(--accent2)}

<script>
var quiz = window.CppQuizData || module.exports
var adapter = CppAdapter
var LETTERS = ['A','B','C','D','E','F','G','H']
var TYPE_NAME = { single:'单选题', multi:'多选题', judge:'判断题' }
var LEVEL_NAME = { 1:'入门', 2:'进阶', 3:'拔高' }
var CAT_NAME = {}
quiz.CATEGORIES.forEach(function (c) { CAT_NAME[c.key] = c.name })

/* Browser statistics are populated by web-runtime.js. */
var ONLINE = 0
var MOCK_WRONG = []
var MOCK_FAV = []
var MOCK_ANS = 0
var MOCK_ACC = 0

var state = { page: 'home', mode: 'seq', cat: '', tab: 'wrong', openIdx: -1, log: '', logTone: 'dim', loading: false, srcOn: {} }

var MODE_LABEL = { study: 'C++ 刷题', seq: '顺序练习', random: '随机练习', exam: '模拟考试', wrong: '错题重练', fav: '收藏练习' }
var CAT_SHORT = { syntax: '语法', algo: '算法', interview: '面试', modern: '新特性' }

/* 标题：从分类进来要能看出在练哪一类，否则每个入口都写「顺序练习」会误导 */
function titleOf() {
  var t = MODE_LABEL[state.mode] || '练习'
  if(state.mode === 'study' && cur.studyCourse) return CppLearning.courseLabel(cur.studyCourse) + ' · 练习'
  if (state.cat && state.mode !== 'exam') t = (CAT_SHORT[state.cat] || '') + ' · ' + t
  return t
}

/* -------- 答题状态 -------- */
var cur = { list: [], idx: 0, answers: {}, resumed: false }

function shuffle(a) {
  a = a.slice()
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t
  }
  return a
}

/* Legacy picker compatibility; actual resume uses stored IDs. */
var RESUME_AT = {}
var MODE_CN = { seq: '顺序练习', random: '随机练习', exam: '模拟考试', wrong: '错题重练', fav: '收藏练习' }
var COUNT_OPTS = [10, 20, 50, 0]

function startPractice(mode, cat, count) {
  cat = cat || ''
  var pool = cat ? quiz.QUESTIONS.filter(function (q) { return q.cat === cat }) : quiz.QUESTIONS
  if (!pool.length) { flash('暂无可练习的题目'); return }
  var list
  if (mode === 'exam') list = CppLearning.exam(pool,20)
  else if (mode === 'random') list = shuffle(pool).slice(0, count === 0 ? pool.length : (count || 20))
  else if (mode === 'wrong') list = MOCK_WRONG.map(function (i) { return quiz.QUESTIONS[i] }).filter(Boolean)
  else if (mode === 'fav') list = MOCK_FAV.map(function (i) { return quiz.QUESTIONS[i] }).filter(Boolean)
  else list = count > 0 ? pool.slice(0, count) : pool.slice()
  if(!list.length){flash('暂无可练习的题目');return}
  cur.list=list
  state.mode = mode; state.cat = cat
  cur.studyLevel=0;cur.studyCourse='';cur.startedAt=Date.now();cur.finishedAt=0
  cur.idx = 0; cur.answers = {}; cur.resumed = false; cur.completed = false
  state.page = mode === 'exam' ? 'exam' : 'practice'
  render()
}

/* -------- 选题数浮层（v2.6） -------- */
var PICKER = { mode: 'seq', cat: '', count: 20 }

function openPick(mode, cat) {
  cat = cat || ''
  PICKER = { mode: mode, cat: cat, count: 20 }
  var key = cat ? mode + '-' + cat : mode
  var at = RESUME_AT[key]

  var h = ''
  h += '<div class="sp-handle"></div>'
  h += '<div class="pk-kick">' + (cat ? (CAT_SHORT[cat] || '') + ' · ' : '') + 'PRACTICE</div>'
  h += '<div class="pk-t">' + (MODE_CN[mode] || '练习') + '</div>'
  h += '<div class="pk-s">' + (at ? '上次停在第 ' + (at + 1) + ' 题，接着刷还是重开？' : '这一轮刷多少题？') + '</div>'
  h += '<div class="pk-row">'
  COUNT_OPTS.forEach(function (n, i) {
    h += '<div class="pk-c ' + (i === 1 ? 'on' : '') + '" data-c="' + n + '" onclick="pickCount(this)">'
    h += '  <span class="n">' + (n || '全部') + '</span><span class="u">题</span>'
    h += '</div>'
  })
  h += '</div>'
  h += '<div class="pk-go" onclick="goPick(' + (at ? at : -1) + ')">' + (at ? '接着上次（第 ' + (at + 1) + ' 题）' : '开始刷 ' + PICKER.count + ' 题') + '</div>'
  if (at) h += '<div class="pk-back" onclick="goPick(-1)">按新题数重新开始</div>'
  showPane(h)
}

function pickCount(el) {
  var row = el.parentNode
  for (var i = 0; i < row.children.length; i++) row.children[i].classList.remove('on')
  el.classList.add('on')
  PICKER.count = Number(el.getAttribute('data-c'))
  var go = el.parentNode.parentNode.querySelector('.pk-go')
  if (go) go.textContent = PICKER.count ? '开始刷 ' + PICKER.count + ' 题' : '把这一类全刷完'
}

function goPick(resumeAt) {
  closeBook()
  startPractice(PICKER.mode, PICKER.cat, PICKER.count)
  if (resumeAt >= 0) {
    cur.idx = Math.min(resumeAt, cur.list.length - 1)
    cur.resumed = true
    render()
  }
}

/* -------- 渲染 -------- */
function render() {
  var el = document.getElementById('screen')
  var html = ''
  var fn = { home: vHome, learn: vLearn, practice: vPractice, exam: vPractice, bank: vBank, result: vResult, wrong: vWrong, import: vImport, books: vBooks }[state.page]
  html = fn ? fn() : vHome()
  el.innerHTML = html

  el.scrollTop = 0
}

function go(p) {
  if (p === 'practice' || p === 'exam') { startPractice(p === 'exam' ? 'exam' : 'seq'); return }
  closeBook()
  state.page = p; state.openIdx = -1
  render()
}

function esc(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
}

/* ---------------- 首页 ---------------- */
function vHome() { return vSimpleHome() }

/* ---------------- 答题页 ---------------- */
function vPractice() {
  var isExam = state.mode === 'exam'
  var q = cur.list[cur.idx]
  if (!q) return vHome()
  var a = cur.answers[q.id] || { picked: [], answered: false }
  var revealed = !isExam && a.answered
  var pct = Math.round(((cur.idx + 1) / cur.list.length) * 100)

  var cls = q.options.map(function (_, i) {
    if (revealed) return q.ans.indexOf(i) >= 0 ? 'right' : (a.picked.indexOf(i) >= 0 ? 'wrong' : 'dim')
    return a.picked.indexOf(i) >= 0 ? 'picked' : ''
  })

  var h = ''
  h += '<div class="nav"><div class="nav-back" onclick="go(\'home\')">‹</div>'
  h += '<div class="nav-title">' + titleOf() + '</div>'
  h += '<div class="nav-act">逐题练习</div></div>'

  h += '<div class="pline" style="background:linear-gradient(to right, #1B1917 0%, #1B1917 ' + pct + '%, rgba(27,25,23,.07) ' + pct + '%, rgba(27,25,23,.07) 100%)"></div>'

  if (cur.resumed && !isExam) {
    h += '<div class="resume">'
    h += '  <span class="resume-t">接着上次 · 第 ' + (cur.idx + 1) + ' / ' + cur.list.length + ' 题</span>'
    h += '  <span class="resume-x" onclick="restartNow()">重新开始</span>'
    h += '</div>'
  }

  h += '<div class="qmeta">'
  h += '  <span class="qm-i serif">' + (cur.idx + 1) + '<span class="qm-t">/' + cur.list.length + '</span></span>'
  h += '  <span class="qm-dot">·</span>'
  h += '  <span class="qm-t2">' + (TYPE_NAME[q.type] || '') + '</span>'
  h += '  <span class="qm-t2">' + (LEVEL_NAME[q.level] || '') + '</span>'
  if (CAT_SHORT[q.cat]) h += '  <span class="qm-cat">' + CAT_SHORT[q.cat] + '</span>'
  h += '  <span class="qm-timer ' + (isExam ? 'exam' : '') + '">' + webTime() + '</span>'
  h += '</div>'

  h += '<div class="qtext">' + esc(q.q) + '</div>'
  h += '<div class="question-origin">'+esc((state.mode==='study'&&cur.studyCourse?CppLearning.courseLabel(cur.studyCourse):CppLearning.describe(q).labels.join(' / '))+' · '+CppLearning.describe(q).source)+'</div>'
  if (q.code) h += '<div class="code">' + esc(q.code) + '</div>'

  h += '<div class="opts">'
  q.options.forEach(function (o, i) {
    h += '<div class="opt ' + cls[i] + '" onclick="pick(' + i + ')">'
    h += '  <span class="ok-l">' + LETTERS[i] + '</span>'
    h += '  <span class="ot">' + esc(o) + '</span>'
    if (cls[i] === 'right') h += '<span class="om" style="color:var(--ok)">✓</span>'
    if (cls[i] === 'wrong') h += '<span class="om" style="color:var(--err)">✕</span>'
    h += '</div>'
  })
  h += '</div>'

  if (q.type === 'multi' && !a.answered) h += '<div class="mtip">多选题 · 可选多个，选完点「确认作答」</div>'
  if (q.type === 'multi' && !a.answered) h += '<button class="btn" onclick="submitMulti()">确认作答</button>'

  if (revealed) {
    var right = a.right
    h += '<div class="exp">'
    h += '  <div class="exp-head"><span class="exp-st" style="color:' + (right ? 'var(--ok)' : 'var(--err)') + '">'
      + (right ? '答对了' : '答错了') + '</span>'
    h += '  <span class="exp-ans serif">' + q.ans.map(function (n) { return LETTERS[n] }).join('、') + '</span></div>'
    if (!right) h += '  <div class="exp-you">你选的是 ' + (a.picked.length ? a.picked.map(function (n) { return LETTERS[n] }).join('、') : '未作答') + '</div>'
    h += '  <div class="exp-line"></div>'
    h += '  <div class="exp-t">' + esc(q.exp) + '</div>'
    if(q.followUp) h += '<details class="followup"><summary class="followup-title">延伸理解（选看）</summary><div class="exp-t">'+esc(q.followUp)+'</div></details>'
    if(q.reference && /^https:\/\//.test(q.reference.url)) h += '<a class="reference-link" target="_blank" rel="noopener noreferrer" href="'+esc(q.reference.url).replace(/"/g,'&quot;')+'">参考资料 · '+esc(q.reference.title)+' ↗</a>'
    h += '</div>'
  }

  h += '<div class="pad-b"></div>'

  var last = cur.idx === cur.list.length - 1
  h += '<div class="bb">'
  h += '  <div class="bb-ico ' + (cur.idx === 0 ? 'off' : '') + '" onclick="prev()">‹</div>'
  h += '  <div class="bb-main" onclick="next()">' + (last ? (isExam ? '交卷' : '完成') : (a.answered ? '下一题' : '跳过')) + '</div>'
  h += '  <div class="bb-ico" onclick="toggleFav()">'+(WebStore.isFav(q.id)?'★':'☆')+'</div>'
  h += '</div>'
  return h
}

function restartNow() {
  cur.startedAt=Date.now();cur.finishedAt=0
  cur.idx = 0; cur.answers = {}; cur.resumed = false; cur.completed = false
  render()
}

function pick(i) {
  var q = cur.list[cur.idx]
  var a = cur.answers[q.id] || { picked: [], answered: false }
  if (a.answered && state.page !== 'exam') return
  if (q.type === 'multi') {
    var p = a.picked.indexOf(i)
    if (p >= 0) a.picked.splice(p, 1); else a.picked.push(i)
    a.answered = false
    cur.answers[q.id] = a; render(); return
  }
  a.picked = [i]; a.answered = true
  a.right = a.picked.slice().sort().join() === q.ans.slice().sort().join()
  cur.answers[q.id] = a
  render()
}

function submitMulti() {
  var q = cur.list[cur.idx]
  var a = cur.answers[q.id]
  if (!a || !a.picked.length || a.answered) return
  a.answered = true
  a.right = a.picked.slice().sort().join() === q.ans.slice().sort().join()
  render()
}

function prev() {
  if (cur.idx === 0) return
  cur.idx--; render()
}

function next() {
  /* v2.6：未作答不再拦着，直接前进（跳过的题最后按错算） */
  if (cur.idx >= cur.list.length - 1) { cur.completed = true; cur.finishedAt=Date.now(); if(state.mode === 'study')cur.list.forEach(function(q){PREVIEW_DONE[q.id]=true}); state.page = 'result'; render(); return }
  cur.idx++; render()
}



var flashT = null
function flash(msg) {
  var el = document.getElementById('flash')
  if (!el) {
    el = document.createElement('div')
    el.id = 'flash'
    el.style.cssText = 'position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);background:rgba(27,25,23,.86);'
      + 'color:#fff;font-size:13px;padding:10px 18px;border-radius:10px;z-index:99;transition:opacity .2s;pointer-events:none'
    document.body.appendChild(el)
  }
  el.textContent = msg
  el.style.opacity = '1'
  clearTimeout(flashT)
  flashT = setTimeout(function () { el.style.opacity = '0' }, 1100)
}

/* ---------------- 图书详情浮层 ---------------- */
function findBook(id) {
  var B = window.BOOK_DATA
  if (!B) return null
  for (var i = 0; i < B.BOOKS.length; i++) if (B.BOOKS[i].id === id) return B.BOOKS[i]
  return null
}

function fallbackCopy(s, done) {
  var ta = document.createElement('textarea')
  ta.value = s
  ta.style.position = 'fixed'
  ta.style.top = '-999px'
  ta.style.opacity = '0'
  document.body.appendChild(ta)
  ta.select()
  var ok = false
  try { ok = document.execCommand('copy') } catch (e) { ok = false }
  document.body.removeChild(ta)
  if (ok) done(); else flash('复制失败，请手动选中链接')
}

function copyText(s, msg) {
  var done = function () { flash(msg || '已复制') }
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(s).then(done, function () { fallbackCopy(s, done) })
  } else {
    fallbackCopy(s, done)
  }
}

function openBook(id) {
  var b = findBook(id)
  if (!b) return
  var free = b.group === 'free'
  var h = '<div class="sp-handle"></div>'
  h += '<div class="sp-kick">' + (free ? '免费可读' : '经典必读') + '</div>'
  h += '<div class="sp-t">' + b.title + '</div>'
  h += '<div class="sp-en">' + b.en + '</div>'
  h += '<div class="sp-meta">' + b.author + ' · ' + b.year + ' · ' + b.level + '</div>'
  h += '<div class="sp-line"></div>'
  h += '<div class="sp-d">' + b.desc + '</div>'
  h += '<div class="sp-why"><span class="k">为什么读</span><span class="v">' + b.why + '</span></div>'
  if (free) {
    h += '<div class="sp-lic">' + (b.lic || '') + (b.size ? ' · ' + b.size : '') + '</div>'
    h += '<div class="sp-btns">'
    h += '<a class="sp-btn" href="' + b.url + '" target="_blank" rel="noopener">'
      + (b.action === 'pdf' ? '在线阅读 PDF ↗' : '打开官方文档 ↗') + '</a>'
    h += '<button class="sp-btn ghost" onclick="copyText(\'' + b.url + '\',\'链接已复制，去浏览器粘贴\')">复制链接</button>'
    h += '<button class="sp-btn plain" onclick="closeBook()">关闭</button>'
    h += '</div>'
  } else {
    h += '<div class="sp-lic">' + (b.note || '') + '</div>'
    h += '<div class="sp-d" style="margin-top:12px;color:var(--ink3);font-size:11.5px">'
      + '这本是仍在售的版权书，本页只给书目信息，不提供电子版。</div>'
    h += '<div class="sp-btns">'
    h += '<button class="sp-btn" onclick="copyText(\'' + (b.title + ' ' + (b.en || '')).replace(/'/g, '') + '\',\'书名已复制\')">复制书名去搜</button>'
    h += '<button class="sp-btn plain" onclick="closeBook()">关闭</button>'
    h += '</div>'
  }
  showPane(h)
}

/* 通用：往底部浮层里塞内容并滑出 */
function showPane(h) {
  var pane = document.getElementById('spane')
  var wrap = document.getElementById('sheetwrap')
  wrap.classList.remove('on')
  pane.innerHTML = h
  pane.scrollTop = 0
  if (document.documentElement.className.indexOf('still') >= 0) {
    wrap.classList.add('on')
    return
  }
  requestAnimationFrame(function () {
    requestAnimationFrame(function () { wrap.classList.add('on') })
  })
}

function closeBook() {
  var wrap = document.getElementById('sheetwrap')
  if (!wrap) return
  wrap.classList.remove('on')
  setTimeout(function () {
    if (!wrap.classList.contains('on')) document.getElementById('spane').innerHTML = ''
  }, 300)
}

function toggleItem(i) {
  state.openIdx = state.openIdx === i ? -1 : i
  render()
}

/* ---------------- 错题本 ---------------- */
function vWrong() {
  var ids = state.tab === 'wrong' ? MOCK_WRONG : MOCK_FAV

  var h = ''
  h += '<div class="nav"><div class="nav-back" onclick="go(\'home\')">‹</div><div class="nav-title">复习</div></div>'
  h += '<div class="tabs">'

    h += '<span class="it-q">' + esc(q.q) + '</span></div>'
    h += '<div style="padding:6px 0 0 26px">'
    h += '<span class="tag">' + (CAT_NAME[q.cat] || '') + '</span>'
    h += '<span class="tag">' + (TYPE_NAME[q.type] || '') + '</span>'
    if (state.tab === 'wrong') h += '<span class="tag err">错 ' + WebStore.wrongTimes(q.id) + ' 次</span>'
    h += '</div>'
    if (open) {
      h += '<div class="it-body">'
      if (q.code) h += '<div class="code">' + esc(q.code) + '</div>'
      h += '<div class="it-l"><span class="k">正确答案</span><span class="v serif" style="color:var(--ok)">'
        + q.ans.map(function (n) { return LETTERS[n] }).join('、') + '</span></div>'

      h += '<div class="it-rm" onclick="event.stopPropagation();removeReview('+i+')">' + (state.tab === 'wrong' ? '已掌握，移出错题本' : '取消收藏') + '</div>'

    + (state.tab === 'wrong' ? '重练错题' : '练习收藏') + '</div>'
  h += '<div class="bb-ico" style="opacity:0">·</div></div>'
  return h
}

function switchTab(t) { state.tab = t; state.openIdx = -1; render() }

/* ---------------- 导入 ---------------- */
var SAMPLE = '1. 下列关于虚函数表的说法，正确的是？\nA. 每个类都有一张虚函数表\nB. 含有虚函数的类才有虚函数表，对象中存放 vptr\nC. 虚函数表在栈上分配\nD. 虚函数表每个对象一份\n答案：B\n解析：只有含虚函数的类才有 vtable，对象内只存一个指针 vptr。\n\n2. 下列哪些属于稳定排序？\nA. 归并排序\nB. 冒泡排序\nC. 快速排序\nD. 简单选择排序\n【答案】A,B'

  h += '<div class="head"><div class="kicker">Import</div><div class="h1 serif">粘贴导入</div>'
  h += '<div class="head-d">牛客、网页、Word 里的题，整段复制过来，自动切成可刷的题。</div></div>'

  h += '<div class="ta-card"><textarea class="ta" id="ta" placeholder="在此粘贴，支持一次多题：&#10;&#10;1. 题干……&#10;A. 选项 A&#10;B. 选项 B&#10;C. 选项 C&#10;D. 选项 D&#10;答案：B&#10;解析：……">' + esc(window.TA_TEXT || '') + '</textarea>'

      h += '<div style="display:flex;justify-content:space-between;margin-bottom:8px">'

      h += '<div style="font-size:13.5px;line-height:1.7;margin-bottom:7px">' + esc(q.q) + '</div>'

          + (isAns ? 'var(--ok)' : 'var(--ink3)') + '">' + LETTERS[k] + '</span>'
        h += '<span style="flex:1;font-size:12.5px;color:var(--ink2)">' + esc(o) + '</span></div>'

    ['答案', '答案：B ｜【答案】A,B ｜ 正确答案：C'],
    ['多选', '写 A,B 或 A、B、D，自动判成多选'],
    ['判断', '选项是「正确 / 错误」时自动判成判断'],
    ['解析', '以「解析：」开头，可以没有'],
    ['题号', '1. ｜ 1、 ｜ 第 1 题，也可以不写']].forEach(function (r) {
    h += '<div class="f"><span class="f-k">' + r[0] + '</span><span class="f-v">' + r[1] + '</span></div>'
  })

  return h
}

function fillSample() {
  window.TA_TEXT = SAMPLE
  render()
  doParse()
}

function clearTa() {
  window.TA_TEXT = ''
  window.PARSE_LIST = null
  render()
}

function doParse() {
  var ta = document.getElementById('ta')
  var txt = ta ? ta.value : (window.TA_TEXT || '')
  window.TA_TEXT = txt
  if (!txt.trim()) { flash('先粘贴题目'); return }
  var r = adapter.parseText(txt, 'syntax', [])
  if (!r.converted) { flash('没识别到题目'); return }
  window.PARSE_LIST = r.list
  render()
  flash('识别 ' + r.converted + ' 题')
}

<script>
/* 初始化 */
var _hash = (location.hash || '').replace('#', '')
/* 支持 #practice / #practice-algo / #practice-random-algo / #wrong / #fav，方便逐入口验收标题 */
var _isPrac = _hash.indexOf('practice') === 0 || _hash === 'exam' || _hash === 'wrong' || _hash === 'fav' || _hash === 'random'
if (_isPrac) {
  var _parts = _hash.split('-')
  var _m = 'seq'
  var _c = ''
  if (_hash === 'wrong') _m = 'wrong'
  else if (_hash === 'fav') _m = 'fav'
  else if (_hash === 'random') _m = 'random'
  else if (_hash === 'exam') _m = 'exam'
  else if (_parts.length > 1) {
    if (MODE_LABEL[_parts[1]]) { _m = _parts[1]; _c = _parts[2] || '' }
    else { _c = _parts[1] }
  }
  startPractice(_m, _c)
} else if (_hash.indexOf('books') === 0) {
  state.page = 'books'
  render()
  var _bid = _hash.split('-')[1]
  if (_bid) openBook(_bid)
} else if (_hash === 'import') {
  window.TA_TEXT = SAMPLE
  state.page = 'import'; render(); doParse()
} else if (_hash) {
  state.page = _hash; render()
} else {
  render()
}

</script>
